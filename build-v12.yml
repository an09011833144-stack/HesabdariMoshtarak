name: Hesabdari Moshtarak V12 - Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V8 source ZIP
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP="HesabdariMoshtarak_v8_professional_sync_ready_FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "$ZIP"

          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

      - name: Extract Android project
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -o \
            HesabdariMoshtarak_v8_professional_sync_ready_FIXED.zip \
            -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | sort

      - name: Verify Android project
        run: |
          set -e

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml

          echo "Android project structure is OK."

      - name: Configure Gradle
        run: |
          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Firebase
        working-directory: project
        run: |
          set -e

          test -f app/google-services.json

          grep -q 'com.hesabdari.moshtarak' \
            app/google-services.json

          grep -q 'com.hesabdari.moshtarak' \
            app/build.gradle.kts

          echo "Firebase configuration is OK."

      - name: Clean project
        working-directory: project
        run: |
          set -e
          gradle clean --stacktrace

      - name: Build Debug APK
        working-directory: project
        run: |
          set -e

          gradle assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabdariMoshtarak-V12-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
