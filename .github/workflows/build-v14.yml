name: Hesabdari Moshtarak V14 - Final Sync APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V14 ZIP
        run: |
          set -e
          ZIP="HesabdariMoshtarak_V14_FINAL_SYNC.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP"
          echo "V14 ZIP OK"
          ls -lh "$ZIP"

      - name: Extract Android project
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -o HesabdariMoshtarak_V14_FINAL_SYNC.zip -d project

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/firestore.rules

          echo "Android project structure OK"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure Gradle
        run: |
          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

      - name: Verify Firebase configuration
        working-directory: project
        run: |
          set -e

          grep -q 'com.hesabdari.moshtarak' app/google-services.json
          grep -q 'com.hesabdari.moshtarak' app/build.gradle.kts

          test -s firestore.rules

          echo "Firebase configuration OK"

      - name: Clean
        working-directory: project
        run: |
          gradle clean --stacktrace

      - name: Build Debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabdariMoshtarak-V14-Final-Sync-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
