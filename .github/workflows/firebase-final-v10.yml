name: Hesabdari Moshtarak V10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          set -e
          test -f HesabdariMoshtarak_v7_professional_sync.zip
          unzip -t HesabdariMoshtarak_v7_professional_sync.zip
          unzip -l HesabdariMoshtarak_v7_professional_sync.zip

      - name: Extract project
        run: |
          set -e
          rm -rf project
          unzip -o HesabdariMoshtarak_v7_professional_sync.zip

          test -d HesabdariMoshtarak_v1
          mv HesabdariMoshtarak_v1 project

      - name: Verify source
        working-directory: project
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/hesabdari/moshtarak/MainActivity.kt

          grep -q '2.1.0' build.gradle.kts
          grep -q 'firebase-bom:33.10.0' app/build.gradle.kts
          grep -q 'android.useAndroidX=true' gradle.properties
          grep -q 'android.enableJetifier=true' gradle.properties
          grep -q 'com.hesabdari.moshtarak' app/google-services.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build clean APK
        working-directory: project
        run: |
          set -e
          gradle clean assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        run: |
          set -e
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabdariMoshtarak-V10-Professional-Sync
          path: project/app/build/outputs/apk/debug/app-debug.apk
