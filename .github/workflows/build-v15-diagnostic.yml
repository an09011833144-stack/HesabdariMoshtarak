name: Hesabdari Moshtarak V15 Diagnostic APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Verify V15 source ZIP
    run: |
      set -e
      ZIP="HesabdariMoshtarak_V15_DIAGNOSTIC.zip"
      test -s "$ZIP"
      unzip -t "$ZIP"
      ls -lh "$ZIP"

  - name: Extract Android project
    run: |
      set -e
      rm -rf project
      mkdir project
      unzip -o HesabdariMoshtarak_V15_DIAGNOSTIC.zip -d project
      test -f project/settings.gradle.kts
      test -f project/app/build.gradle.kts
      test -f project/app/google-services.json
      test -f project/app/src/main/AndroidManifest.xml
      test -f project/app/src/main/java/com/hesabdari/moshtarak/MainActivity.kt
      test -f project/app/src/main/java/com/hesabdari/moshtarak/DiagnosticApplication.kt

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Configure Gradle
    run: |
      cat > project/gradle.properties <<'EOF'
      android.useAndroidX=true
      android.enableJetifier=true
      android.suppressUnsupportedCompileSdk=35
      org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
      EOF

  - name: Verify diagnostic hooks
    working-directory: project
    run: |
      set -e
      grep -q 'com.hesabdari.moshtarak.diagnostic' app/build.gradle.kts
      grep -q 'last_crash.txt' app/src/main/java/com/hesabdari/moshtarak/MainActivity.kt
      grep -q 'setDefaultUncaughtExceptionHandler' app/src/main/java/com/hesabdari/moshtarak/DiagnosticApplication.kt
      grep -q 'com.hesabdari.moshtarak.diagnostic' app/google-services.json
      echo "V15 diagnostic checks: PASS"

  - name: Clean
    working-directory: project
    run: gradle clean --stacktrace

  - name: Build Diagnostic APK
    working-directory: project
    run: gradle assembleDebug --stacktrace --warning-mode all

  - name: Verify APK
    run: |
      set -e
      APK="project/app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      file "$APK"
      ls -lh "$APK"
      sha256sum "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HesabdariMoshtarak-V15-Diagnostic-APK
      path: project/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
