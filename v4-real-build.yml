name: V4 Real Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check V4 ZIP
        run: |
          test -f HesabdariMoshtarak_v4_professional.zip
          unzip -l HesabdariMoshtarak_v4_professional.zip

      - name: Extract V4
        run: |
          unzip -o HesabdariMoshtarak_v4_professional.zip
          test -d HesabdariMoshtarak_v1
          mv HesabdariMoshtarak_v1 project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project
        working-directory: project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabdariMoshtarak-V4-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
