name: Hesabdari Moshtarak V11 - V8 Professional Sync APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V8 source ZIP
        run: |
          set -e

          test -f HesabdariMoshtarak_v8_professional_sync_ready.zip

          echo "Checking ZIP integrity..."
          unzip -t HesabdariMoshtarak_v8_professional_sync_ready.zip

          echo "ZIP contents:"
          unzip -l HesabdariMoshtarak_v8_professional_sync_ready.zip

      - name: Extract V8 project
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -o HesabdariMoshtarak_v8_professional_sync_ready.zip -d project

          echo "Extracted project:"
          find project -maxdepth 3 -type f | sort

      - name: Verify Android project
        run: |
          set -e

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/google-services.json
          test -f project/app/src/main/AndroidManifest.xml

          echo "Android project structure OK"

      - name: Configure Gradle properties
        run: |
          cat > project/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Firebase configuration
        working-directory: project
        run: |
          set -e

          test -f app/google-services.json

          grep -q 'com.hesabdari.moshtarak' app/google-services.json
          grep -q 'com.hesabdari.moshtarak' app/build.gradle.kts

          echo "Firebase configuration OK"

      - name: Clean build
        working-directory: project
        run: |
          set -e

          gradle clean --stacktrace

      - name: Build Debug APK
        working-directory: project
        run: |
          set -e

          gradle assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabdariMoshtarak-V8-Professional-Sync-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
